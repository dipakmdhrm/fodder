name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # Build every package (.deb, .rpm, Arch, Flatpak) on each PR so a release tag
  # is just a repeat of an already-validated build. Uses the same reusable
  # workflow the Release pipeline calls. Gated on `check` to avoid burning
  # runners when formatting/lint/tests fail.
  packages:
    needs: check
    uses: ./.github/workflows/build-packages.yml
    with:
      version: 0.0.0
