name: Build packages

# Reusable workflow: builds every distributable package (.deb, .rpm, Arch,
# Flatpak) and uploads them as artifacts. Called by CI (on pull requests, to
# prove everything still builds) and by Release (on a tag, to produce the
# artifacts that get signed/published). Because both paths call this same
# workflow, a green PR means the tag build is just a repeat.

on:
  workflow_call:
    inputs:
      version:
        description: Version string embedded in the package filenames/metadata.
        required: true
        type: string
      ref:
        description: >-
          Git ref (tag/branch/SHA) to build. Leave empty to build the ref that
          triggered the caller (the PR head on CI, the tag on a tag-push
          release). The auto-release flow passes the freshly-pushed tag so the
          build picks up the version-bump commit.
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  # .deb (amd64 + arm64)
  build-deb:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,     arch: amd64 }
          - { runner: ubuntu-24.04-arm,  arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install build + runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Stage and build .deb
        run: |
          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/DEBIAN" "$STAGING/usr/bin" \
                   "$STAGING/usr/share/applications" "$STAGING/usr/share/icons"

          install -m0755 target/release/fodderd "$STAGING/usr/bin/fodderd"
          install -m0755 target/release/fodder  "$STAGING/usr/bin/fodder"
          install -m0644 data/applications/io.github.dipakmdhrm.Fodder.desktop \
            "$STAGING/usr/share/applications/"
          cp -r data/icons/hicolor "$STAGING/usr/share/icons/hicolor"

          for f in postinst prerm postrm; do
            install -m0755 "packaging/deb/$f" "$STAGING/DEBIAN/$f"
          done
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@ARCH@/${{ matrix.arch }}/" \
            packaging/deb/control.template > "$STAGING/DEBIAN/control"

          dpkg-deb --root-owner-group --build "$STAGING" \
            "fodder_${VERSION}_${{ matrix.arch }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: fodder_*.deb

  # .rpm (x86_64 + aarch64), built inside Fedora
  build-rpm:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,    rpmarch: x86_64 }
          - { runner: ubuntu-24.04-arm, rpmarch: aarch64 }
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Install build tools
        run: |
          # tar + zstd are needed by actions/cache inside the minimal container.
          dnf install -y git rpm-build cargo rust gcc tar zstd \
            gtk4-devel libadwaita-devel webkitgtk6.0-devel

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Cache the expensive dependency builds (gtk4-sys, webkit6-sys, ring,
      # bundled SQLite, ...) so only the workspace crates recompile. This is
      # what makes the deb job fast; the container job lacked it. rpmbuild
      # normally compiles in an ephemeral BUILD dir, so we redirect cargo's
      # target dir to a stable, cacheable path (see the spec's cargo_target
      # macro + --define below) and point rust-cache at it.
      - uses: Swatinem/rust-cache@v2
        with:
          key: rpm-${{ matrix.rpmarch }}
          workspaces: ". -> rpm-target"

      - name: Build .rpm
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          SRC=$(mktemp -d)
          mkdir "$SRC/fodder-${VERSION}"
          cp -r Cargo.toml Cargo.lock core fodderd fodder data LICENSE \
            "$SRC/fodder-${VERSION}/"
          tar -czf "rpmbuild/SOURCES/fodder-${VERSION}.tar.gz" -C "$SRC" "fodder-${VERSION}"

          CHANGELOG_DATE=$(date "+%a %b %d %Y")
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@CHANGELOG_DATE@/${CHANGELOG_DATE}/g" \
            packaging/rpm/fodder.spec > rpmbuild/SPECS/fodder.spec

          # Compile into the cached target dir shared with rust-cache above.
          rpmbuild --define "_topdir ${PWD}/rpmbuild" \
            --define "cargo_target ${GITHUB_WORKSPACE}/rpm-target" \
            -bb rpmbuild/SPECS/fodder.spec
          find rpmbuild/RPMS -name '*.rpm' -exec cp {} . \;

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpmarch }}
          path: "*.rpm"

  # Arch package (x86_64), built inside Arch. Links the system SQLite instead
  # of the bundled copy (see packaging/arch/PKGBUILD) so it survives makepkg's
  # hardening link flags.
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm git base-devel rust sqlite \
            gtk4 libadwaita webkitgtk-6.0

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build pacman package
        run: |
          mkdir -p arch-build
          SRC=$(mktemp -d)
          mkdir "$SRC/fodder-${VERSION}"
          cp -r Cargo.toml Cargo.lock core fodderd fodder data LICENSE \
            "$SRC/fodder-${VERSION}/"
          tar -czf "arch-build/fodder-${VERSION}.tar.gz" -C "$SRC" "fodder-${VERSION}"

          sed "s/@VERSION@/${VERSION}/g" packaging/arch/PKGBUILD > arch-build/PKGBUILD
          cp packaging/arch/fodder.install arch-build/

          useradd -m builder
          chown -R builder:builder arch-build
          su builder -c "cd arch-build && makepkg --noconfirm --skipinteg"

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: arch-build/*.pkg.tar.zst

  # Flatpak bundle + per-arch ostree repo (amd64 + arm64)
  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # flatpak-builder validates its cache by source checksum, so this safely
      # skips rebuilding unchanged modules (big win when re-running the same
      # tag; a cache miss just falls back to a full build).
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/**', 'Cargo.lock') }}
          restore-keys: |
            flatpak-${{ matrix.arch }}-

      - name: Install flatpak-builder + runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo build-dir \
            packaging/flatpak/io.github.dipakmdhrm.Fodder.yml
          flatpak build-bundle repo \
            "fodder-${{ matrix.arch }}.flatpak" io.github.dipakmdhrm.Fodder

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: fodder-*.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: repo
