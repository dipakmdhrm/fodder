name: Auto Release

# Fully-automatic release on merge to main. The only manual gate is merging the
# feature PR; once it lands, this workflow cuts a release with no further input.
#
# Flow:
#   1. Read the merged PR's `release:*` label to pick the bump (default: patch).
#   2. Compute the next version from the newest `v*` tag.
#   3. Bump [workspace.package] version in Cargo.toml, sync Cargo.lock, and
#      stamp CHANGELOG.md (Unreleased -> the new version).
#   4. Commit + push that to main, then create and push the tag.
#   5. Invoke release.yml (workflow_call) to build + publish, pointing it at the
#      tag so the build includes the bump commit.
#
# No release loop: the bump commit and tag are pushed with the default
# GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do NOT trigger other workflow
# runs. That's also why release.yml is invoked via workflow_call here rather
# than relying on its `push: tags` trigger (the token-pushed tag wouldn't fire
# it). Add a `release:skip` label to a PR to merge without releasing.

on:
  push:
    branches: [main]

# Serialize releases so two quick merges can't race on the tag/main push.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.bump.outputs.release }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # need full history + all tags to bump/tag
          token: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@stable   # for `cargo update` (Cargo.lock sync)

      - name: Bump version, changelog, and tag
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # --- Pick the bump from the merged PR's release:* label -------------
          PR=$(gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                 --jq '.[0].number // empty' 2>/dev/null || true)
          BUMP=patch
          if [ -n "$PR" ]; then
            LABELS=$(gh pr view "$PR" --json labels --jq '.labels[].name' || true)
            if echo "$LABELS" | grep -qx 'release:skip'; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "### No release: PR #$PR is labeled release:skip" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$LABELS" | grep -qx 'release:major' && BUMP=major || true
            echo "$LABELS" | grep -qx 'release:minor' && BUMP=minor || true
          fi

          # --- Compute the next version from the newest v* tag ---------------
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          LATEST=${LATEST:-v0.0.0}
          IFS=. read -r MA MI PA <<< "${LATEST#v}"
          case "$BUMP" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          VER="${MA}.${MI}.${PA}"
          TAG="v${VER}"
          echo "Releasing ${TAG} (${BUMP}) from ${LATEST}"

          # --- Apply the bump ------------------------------------------------
          # Only the version line inside [workspace.package]; the crates inherit
          # it via `version.workspace = true`.
          sed -i '/^\[workspace\.package\]/,/^\[/ s/^version = ".*"/version = "'"$VER"'"/' Cargo.toml
          # Sync the three workspace members in Cargo.lock without touching any
          # dependency versions, so `cargo build --locked` still passes.
          cargo update --workspace
          # Stamp the changelog: the current "## Unreleased" notes become the new
          # version's section, and a fresh empty "## Unreleased" is left on top.
          if grep -qx '## Unreleased' CHANGELOG.md; then
            awk -v ver="$VER" '
              { print }
              /^## Unreleased$/ && !done { print ""; print "## " ver; done = 1 }
            ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
          fi

          # --- Commit, tag, push --------------------------------------------
          # Pushed with GITHUB_TOKEN, so neither the branch push nor the tag push
          # retriggers a workflow (no release loop). [skip ci] is belt-and-braces.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Release ${TAG} [skip ci]"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

          echo "release=true"    >> "$GITHUB_OUTPUT"
          echo "version=${VER}"  >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"      >> "$GITHUB_OUTPUT"
          echo "### Released ${TAG} (${BUMP})" >> "$GITHUB_STEP_SUMMARY"

  # Build + publish via the same pipeline a manual tag push uses. Pointed at the
  # new tag so it builds the version-bump commit, not the merge commit.
  release:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
