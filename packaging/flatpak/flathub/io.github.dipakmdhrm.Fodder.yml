# Flathub submission manifest for Fodder.
#
# Unlike ../io.github.dipakmdhrm.Fodder.yml (the self-hosted build, which fetches
# rustup and builds with network access), this manifest builds FULLY OFFLINE, as
# Flathub's build workers require:
#   * Rust comes from the org.freedesktop.Sdk.Extension.rust-stable SDK extension
#     (no curl | rustup).
#   * Every crate is vendored via cargo-sources.json (generated by
#     flatpak-cargo-generator.py from Cargo.lock) and cargo runs with
#     CARGO_NET_OFFLINE=true.
#   * Sources are pinned to a git tag + commit, not a local dir.
#
# BEFORE SUBMITTING: set `tag`/`commit` below to the release that CONTAINS the
# metainfo file (data/metainfo/...) and this manifest — i.e. the tag cut AFTER
# this branch merges to main. v0.3.1 predates the metainfo file and will not
# build. Update cargo-sources.json too if dependencies changed since.
app-id: io.github.dipakmdhrm.Fodder
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: fodder-launcher

finish-args:
  # Display + GPU (WebKit rendering). fallback-x11 needs a shared IPC namespace
  # for MIT-SHM.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Fetching feeds and (in the web view) live pages.
  - --share=network
  # Desktop notifications and the StatusNotifierItem tray.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # NB: portals (Background for autostart-on-login, OpenURI for open-in-browser)
  # need no finish-arg — portal access is granted automatically. See
  # core/src/autostart.rs for the Background portal request.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/fodder/cargo

modules:
  - name: fodder
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --workspace --locked --offline
      - install -Dm755 target/release/fodderd /app/bin/fodderd
      - install -Dm755 target/release/fodder /app/bin/fodder
      - install -Dm755 packaging/flatpak/fodder-launcher.sh /app/bin/fodder-launcher
      - install -Dm644 data/applications/io.github.dipakmdhrm.Fodder.desktop
        /app/share/applications/io.github.dipakmdhrm.Fodder.desktop
      - install -Dm644 data/metainfo/io.github.dipakmdhrm.Fodder.metainfo.xml
        /app/share/metainfo/io.github.dipakmdhrm.Fodder.metainfo.xml
      - |
        for s in 16 24 32 48 64 128 256 512; do
          install -Dm644 "data/icons/hicolor/${s}x${s}/apps/io.github.dipakmdhrm.Fodder.png" \
            "/app/share/icons/hicolor/${s}x${s}/apps/io.github.dipakmdhrm.Fodder.png"
        done
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.dipakmdhrm.Fodder.svg
        /app/share/icons/hicolor/scalable/apps/io.github.dipakmdhrm.Fodder.svg
    sources:
      - type: git
        url: https://github.com/dipakmdhrm/fodder.git
        # TODO(before submit): point at the release tag that includes the
        # metainfo file, and set its full commit sha.
        tag: v0.4.0
        commit: '0000000000000000000000000000000000000000'
      - cargo-sources.json
