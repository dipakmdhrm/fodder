name: Release

# Two ways in:
#   - Push a version tag manually, e.g.:  git tag v0.1.0 && git push origin v0.1.0
#   - Called by auto-release.yml on merge to main (workflow_call), which passes
#     the computed version and the freshly-pushed tag as `ref`.
#
# One-time setup (see docs/RELEASING.md):
#   - Secret APT_SIGNING_KEY: an ASCII-armored GPG private key (signs the apt +
#     flatpak repos).
#   - Enable GitHub Pages on the `gh-pages` branch.

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: Version to release (no leading "v"). Set on workflow_call.
        required: true
        type: string
      ref:
        description: >-
          Git ref to build (the release tag). Ensures the build sees the
          version-bump commit rather than the merge commit that triggered the
          caller.
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  # Version from the workflow_call input, or from the tag name on a tag push.
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.VERSION }}
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # Build every package via the shared reusable workflow that CI also runs, so
  # the tag build is identical to what was already validated on the PR. `ref`
  # is empty on a tag push (checkout defaults to the tag) and the release tag on
  # workflow_call (so the build includes the version-bump commit).
  build:
    needs: get-version
    uses: ./.github/workflows/build-packages.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ inputs.ref }}

  # Publish auto-update repos (apt + flatpak) to gh-pages
  #
  # Best-effort: a failure here does not block the GitHub Release below.
  pages:
    needs: [get-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro flatpak ostree

      - name: Import GPG signing key
        id: gpg
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          # The signing key is passphrase-protected, so on this headless runner
          # we must feed the passphrase non-interactively. Two consumers need it:
          #   - direct gpg (apt Release signing) -> uses loopback + --passphrase
          #   - gpgme (ostree/flatpak repo signing) -> can't take a flag, so we
          #     preset the passphrase into gpg-agent for each keygrip.
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'pinentry-mode loopback\n' >> ~/.gnupg/gpg.conf
          printf 'allow-loopback-pinentry\nallow-preset-passphrase\n' >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "${FPR}:6:" | gpg --import-ownertrust
          # Cache the passphrase in the agent for every secret (sub)key keygrip
          # so gpgme-based signers don't need a pinentry.
          PRESET="$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase"
          for GRIP in $(gpg --list-secret-keys --with-keygrip --with-colons \
                          | awk -F: '/^grp/{print $10}'); do
            printf '%s' "$APT_SIGNING_KEY_PASSPHRASE" | "$PRESET" --preset "$GRIP"
          done
          echo "FPR=${FPR}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Clone (or init) gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" gh-pages; then
            git clone --depth 1 --branch gh-pages "$URL" pages
          else
            mkdir pages && cd pages && git init -b gh-pages && git remote add origin "$URL"
          fi

      - name: Build apt repository
        env:
          FPR: ${{ steps.gpg.outputs.FPR }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          cd pages
          mkdir -p conf
          # Note: no `SignWith` here. reprepro signs Release via gpgme, which
          # fails with an opaque "General error" on the runner. Instead we let
          # reprepro build the repo unsigned and sign Release ourselves below
          # with direct gpg calls (reliable with a passphrase-less key).
          {
            echo "Origin: Fodder"
            echo "Label: Fodder"
            echo "Codename: stable"
            echo "Architectures: amd64 arm64"
            echo "Components: main"
            echo "Description: Fodder APT repository"
          } > conf/distributions
          gpg --armor --export "$FPR" | gpg --dearmor > key.gpg
          reprepro -b . remove stable fodder 2>/dev/null || true
          for deb in ../artifacts/deb-*/*.deb; do
            reprepro -b . includedeb stable "$deb"
          done
          # Sign the generated Release file ourselves: InRelease (inline) and
          # Release.gpg (detached), which is what apt clients fetch.
          # Feed the key's passphrase over loopback so signing works headless.
          rel="dists/stable/Release"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$APT_SIGNING_KEY_PASSPHRASE" --local-user "$FPR" \
            --clearsign -o "dists/stable/InRelease" "$rel"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$APT_SIGNING_KEY_PASSPHRASE" --local-user "$FPR" \
            -abs -o "dists/stable/Release.gpg" "$rel"

      - name: Assemble flatpak repository
        env:
          FPR: ${{ steps.gpg.outputs.FPR }}
        run: |
          cd pages
          # The published repo must be an initialized ostree archive repo
          # before pull-local can merge into it. Initialize once; on later
          # releases the repo already exists on gh-pages, so skip re-init.
          if [ ! -d flatpak/objects ]; then
            ostree init --repo=flatpak --mode=archive
          fi
          # Merge each arch's built ostree repo into the shared published repo.
          # GitHub's upload-artifact drops empty directories, but ostree's
          # pull-local expects the source repo's refs/tmp dirs to exist, so
          # recreate them before pulling (else "opendir(refs/remotes)" fails).
          for r in ../artifacts/flatpak-repo-*; do
            mkdir -p "$r"/refs/heads "$r"/refs/mirrors "$r"/refs/remotes \
                     "$r"/tmp "$r"/state
            ostree --repo=flatpak pull-local "$r"
          done
          # Regenerate summary + sign (passphrase is preset in the agent).
          flatpak build-update-repo --gpg-sign="$FPR" flatpak
          gpg --armor --export "$FPR" > flatpak/fodder.gpg
          cat > fodder.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Fodder
          Url=https://${{ github.repository_owner }}.github.io/fodder/flatpak
          Homepage=https://github.com/${{ github.repository }}
          GPGKey=$(gpg --export "$FPR" | base64 -w0)
          EOF

      - name: Commit and push gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd pages
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Release v${VERSION}" || echo "nothing to commit"
          git push origin gh-pages

  # Propose the matching Flathub update (regenerate vendored crates, repoint the
  # manifest at this tag+commit, open a PR to the Flathub app repo). Runs on both
  # a manual tag push and the auto-release workflow_call, since release.yml is the
  # shared entry point for both. Dormant until opted in: gated on the repo
  # variable FLATHUB_AUTOPUBLISH, and the called workflow additionally no-ops
  # without the FLATHUB_TOKEN secret. See docs/RELEASING.md.
  flathub:
    needs: get-version
    if: ${{ vars.FLATHUB_AUTOPUBLISH == 'true' }}
    uses: ./.github/workflows/flathub-publish.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
    secrets: inherit

  # GitHub Release with all artifacts
  release:
    needs: [get-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          generate_release_notes: true
          # Don't fail if the (non-blocking) Flatpak bundle is missing.
          fail_on_unmatched_files: false
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg.tar.zst
            artifacts/*.flatpak
