name: Release

# Push a version tag to cut a release, e.g.:  git tag v0.1.0 && git push origin v0.1.0
#
# One-time setup (see docs/RELEASING.md):
#   - Secret APT_SIGNING_KEY: an ASCII-armored GPG private key (signs the apt +
#     flatpak repos).
#   - Enable GitHub Pages on the `gh-pages` branch.

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Version from the tag
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.VERSION }}
    steps:
      - id: v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # .deb (amd64 + arm64)
  build-deb:
    needs: get-version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,     arch: amd64 }
          - { runner: ubuntu-24.04-arm,  arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build + runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Stage and build .deb
        run: |
          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/DEBIAN" "$STAGING/usr/bin" \
                   "$STAGING/usr/share/applications" "$STAGING/usr/share/icons"

          install -m0755 target/release/fodderd "$STAGING/usr/bin/fodderd"
          install -m0755 target/release/fodder  "$STAGING/usr/bin/fodder"
          install -m0644 data/applications/io.github.dipakmdhrm.Fodder.desktop \
            "$STAGING/usr/share/applications/"
          cp -r data/icons/hicolor "$STAGING/usr/share/icons/hicolor"

          for f in postinst prerm postrm; do
            install -m0755 "packaging/deb/$f" "$STAGING/DEBIAN/$f"
          done
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@ARCH@/${{ matrix.arch }}/" \
            packaging/deb/control.template > "$STAGING/DEBIAN/control"

          dpkg-deb --root-owner-group --build "$STAGING" \
            "fodder_${VERSION}_${{ matrix.arch }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: fodder_*.deb

  # .rpm (x86_64 + aarch64), built inside Fedora
  build-rpm:
    needs: get-version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,    rpmarch: x86_64 }
          - { runner: ubuntu-24.04-arm, rpmarch: aarch64 }
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y git rpm-build cargo rust gcc \
            gtk4-devel libadwaita-devel webkitgtk6.0-devel

      - uses: actions/checkout@v4

      - name: Build .rpm
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          SRC=$(mktemp -d)
          mkdir "$SRC/fodder-${VERSION}"
          cp -r Cargo.toml Cargo.lock core fodderd fodder data LICENSE \
            "$SRC/fodder-${VERSION}/"
          tar -czf "rpmbuild/SOURCES/fodder-${VERSION}.tar.gz" -C "$SRC" "fodder-${VERSION}"

          CHANGELOG_DATE=$(date "+%a %b %d %Y")
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@CHANGELOG_DATE@/${CHANGELOG_DATE}/g" \
            packaging/rpm/fodder.spec > rpmbuild/SPECS/fodder.spec

          rpmbuild --define "_topdir ${PWD}/rpmbuild" -bb rpmbuild/SPECS/fodder.spec
          find rpmbuild/RPMS -name '*.rpm' -exec cp {} . \;

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpmarch }}
          path: "*.rpm"

  # Arch package (x86_64), built inside Arch
  build-arch:
    needs: get-version
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm git base-devel rust cmake \
            gtk4 libadwaita webkitgtk-6.0

      - uses: actions/checkout@v4

      - name: Build pacman package
        run: |
          mkdir -p arch-build
          SRC=$(mktemp -d)
          mkdir "$SRC/fodder-${VERSION}"
          cp -r Cargo.toml Cargo.lock core fodderd fodder data LICENSE \
            "$SRC/fodder-${VERSION}/"
          tar -czf "arch-build/fodder-${VERSION}.tar.gz" -C "$SRC" "fodder-${VERSION}"

          sed "s/@VERSION@/${VERSION}/g" packaging/arch/PKGBUILD > arch-build/PKGBUILD
          cp packaging/arch/fodder.install arch-build/

          useradd -m builder
          chown -R builder:builder arch-build
          su builder -c "cd arch-build && makepkg --noconfirm --skipinteg"

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: arch-build/*.pkg.tar.zst

  # Flatpak bundle + per-arch ostree repo (amd64 + arm64)
  build-flatpak:
    needs: get-version
    # Non-blocking: Flatpak is the trickiest target; a failure here must not
    # block the deb/rpm/arch release or the apt repo publish.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder + runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo build-dir \
            packaging/flatpak/io.github.dipakmdhrm.Fodder.yml
          flatpak build-bundle repo \
            "fodder-${{ matrix.arch }}.flatpak" io.github.dipakmdhrm.Fodder

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: fodder-*.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: repo

  # Publish auto-update repos (apt + flatpak) to gh-pages
  #
  # Best-effort: a failure here does not block the GitHub Release below.
  pages:
    needs: [get-version, build-deb, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro flatpak

      - name: Import GPG signing key
        id: gpg
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          # Allow non-interactive (loopback) signing so reprepro/gpg don't try to
          # pop a pinentry prompt on the headless runner.
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'pinentry-mode loopback\n' >> ~/.gnupg/gpg.conf
          printf 'allow-loopback-pinentry\nbatch\n' >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "${FPR}:6:" | gpg --import-ownertrust
          echo "FPR=${FPR}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Clone (or init) gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" gh-pages; then
            git clone --depth 1 --branch gh-pages "$URL" pages
          else
            mkdir pages && cd pages && git init -b gh-pages && git remote add origin "$URL"
          fi

      - name: Build apt repository
        env:
          FPR: ${{ steps.gpg.outputs.FPR }}
        run: |
          cd pages
          mkdir -p conf
          {
            echo "Origin: Fodder"
            echo "Label: Fodder"
            echo "Codename: stable"
            echo "Architectures: amd64 arm64"
            echo "Components: main"
            echo "Description: Fodder APT repository"
            echo "SignWith: ${FPR}"
          } > conf/distributions
          gpg --armor --export "$FPR" | gpg --dearmor > key.gpg
          reprepro -b . remove stable fodder 2>/dev/null || true
          for deb in ../artifacts/deb-*/*.deb; do
            reprepro -b . includedeb stable "$deb"
          done

      - name: Assemble flatpak repository
        env:
          FPR: ${{ steps.gpg.outputs.FPR }}
        run: |
          cd pages
          mkdir -p flatpak
          # Merge each arch's ostree repo into the shared published repo.
          for r in ../artifacts/flatpak-repo-*; do
            ostree --repo=flatpak pull-local "$r" 2>/dev/null || \
              flatpak build-commit-from --src-repo="$r" flatpak 2>/dev/null || true
          done
          flatpak build-update-repo --gpg-sign="$FPR" flatpak || true
          gpg --armor --export "$FPR" > flatpak/fodder.gpg
          cat > fodder.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Fodder
          Url=https://${{ github.repository_owner }}.github.io/fodder/flatpak
          Homepage=https://github.com/${{ github.repository }}
          GPGKey=$(gpg --export "$FPR" | base64 -w0)
          EOF

      - name: Commit and push gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd pages
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Release v${VERSION}" || echo "nothing to commit"
          git push origin gh-pages

  # GitHub Release with all artifacts
  release:
    needs: [get-version, build-deb, build-rpm, build-arch, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          generate_release_notes: true
          # Don't fail if the (non-blocking) Flatpak bundle is missing.
          fail_on_unmatched_files: false
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg.tar.zst
            artifacts/*.flatpak
