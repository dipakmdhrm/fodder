[package]
name = "fodderd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "fodderd"
path = "src/main.rs"

[dependencies]
fodder-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "io-util"] }
futures.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
ksni.workspace = true
# Already in the tree via ksni (with the tokio feature); used directly here to
# query the StatusNotifierWatcher for the tray self-heal check.
zbus = "5"
# Decode the embedded PNG app icon into ARGB pixmaps for the tray (so hosts that
# mishandle the themed IconName still render it).
png = "0.17"
notify-rust.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
directories.workspace = true
