[workspace]
resolver = "2"
members = ["core", "fodderd", "fodder"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
authors = ["dipakmdhrm <dipakmdhrm@gmail.com>"]
repository = "https://github.com/dipakmdhrm/fodder"

[workspace.dependencies]
# --- Internal ---
fodder-core = { path = "core" }

# --- GTK trio: keep on the 0.11 gtk4 generation as a coherent set ---
# Use gtk4's re-exported glib (gtk::glib) everywhere; do NOT add a top-level glib.
gtk4 = { version = "0.11.4", features = ["v4_14"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
webkit6 = "0.6.1"

# --- Networking / feed parsing ---
# Use rustls with the `ring` crypto backend (not aws-lc-rs): ring builds without
# cmake/nasm/go, so packaging in minimal distro containers (Arch, Flatpak) works.
# `rustls-no-provider` gives reqwest rustls with no default provider; we install
# ring's provider at startup via `fodder_core::install_default_crypto()`.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "gzip", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
feed-rs = "2.4.0"

# --- Async ---
tokio = "1.53.1"
futures = "0.3"

# --- Storage / config ---
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"

# --- Daemon ---
ksni = "0.3.6"
notify-rust = "4.18.0"

# --- Discovery / sanitize ---
scraper = "0.27.0"
ego-tree = "0.11.0"   # matches scraper 0.27's tree type, for the reader's DOM walk
ammonia = "4.1.4"

# --- Misc ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

# --- Dev ---
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
